  - packages/*
  - plugins/*
catalogMode: prefer
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  typescript: ~7.0.2
  '@types/node': ^26.6.6
  '@stylistic/eslint-plugin': ^5.10.0
  zod: ^4.6.7
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@tailwindcss/vite': ^4.3.5
  tailwindcss: ^4.3.5
  oxc-transform-react: ^0.157.0
  fflate: ^0.8.3
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny: [vite]
